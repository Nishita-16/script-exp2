<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leave Application</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #c9b79c, #bfa98b);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: #fff;
        padding: 30px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    h2 {
        margin-bottom: 20px;
    }

    input, textarea {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    textarea {
        resize: none;
        height: 80px;
    }

    button {
        background: #ff4b5c;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #e03e4f;
    }
</style>
</head>
<body>

<div class="card">
    <h2>Leave Application</h2>
    <form>
        <input type="text" placeholder="Your Name" required><br>
        <input type="date" required><br>
        <input type="date" required><br>
        <textarea placeholder="Reason for leave..." required></textarea><br>
        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
